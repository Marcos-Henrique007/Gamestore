services:
  postgres:
    image: postgres:15
    container_name: gamestore-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: gamestore

    ports:
      - "5432:5432"

    volumes:
      - gamestore_data:/var/lib/postgresql/data

volumes:
  gamestore_data: